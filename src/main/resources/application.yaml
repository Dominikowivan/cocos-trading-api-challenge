spring:
  application:
    name: trading-api
  datasource:
    url: jdbc:postgresql://localhost:5433/trading
    username: trading
    password: trading
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:5000}
  transaction:
    default-timeout: ${SPRING_TRANSACTION_DEFAULT_TIMEOUT:10s}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    write:
      write-bigdecimal-as-plain: true
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/seed

---
spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: ${COCOS_DB_URL}
    username: ${COCOS_DB_USER}
    password: ${COCOS_DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
