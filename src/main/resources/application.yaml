spring:
  application:
    name: trading-api
  datasource:
    url: jdbc:postgresql://localhost:5433/trading
    username: trading
    password: trading
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
  mvc:
    problemdetails:
      enabled: true
  jackson:
    write:
      write-bigdecimal-as-plain: true
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

---
spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: ${COCOS_DB_URL}
    username: ${COCOS_DB_USER}
    password: ${COCOS_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
