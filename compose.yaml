services:
  postgres:
    image: postgres:18.7-alpine
    container_name: trading-api-db
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "5433:5432"
    volumes:
      - trading-api-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trading-api-db-data:
