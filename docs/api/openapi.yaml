openapi: 3.1.0

info:
  title: Cocos Trading API
  version: 1.0.0
  description: |
    The contract of the API as it is today. Every response in the web tests is validated against
    this file (ADR-0024), so it cannot drift from the code without failing the build. A feature that
    changes the API updates it, together with `trading-api.http`.

    Each endpoint was first designed in the spec of its feature, under `specs/`, whose `contracts/`
    folder keeps that design as it was proposed and is not edited afterwards. Requirement ids in the
    descriptions below (`FR-`, `SC-`, research `R-`) refer to the spec of the feature that
    introduced the endpoint: the portfolio's are in `specs/001-portfolio-endpoint/`.

    Two rules shape this contract and are not negotiable per field:

    - **An unknown money figure is `null`, never `0`** (ADR-0013). `null` means "not known";
      `0` means "zero pesos". The keys are always present.
    - **A broken ledger invariant is served as-is** (ADR-0012). A negative quantity is reported
      with its negative market value and a `200`; the alarm is an error-level log, not an HTTP
      status.

servers:
  - url: http://localhost:8080
    description: Local development (docker compose database on port 5433)

paths:
  /api/v1/users/{userId}/portfolio:
    get:
      summary: Get a user's portfolio
      description: |
        The portfolio of one user: total account value, pesos available to trade, and the
        instruments held. Read-only; every figure is computed from the `orders` ledger and
        `marketdata` at request time (ADR-0002).
      operationId: getPortfolio
      parameters:
        - name: userId
          in: path
          required: true
          description: Untrusted identifier; there is no authentication (ADR-0007).
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        "200":
          description: The portfolio. Returned even when the ledger holds an anomaly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
              examples:
                seededUser1:
                  summary: User 1 on the provided dataset (SC-001 to SC-004, SC-012)
                  value:
                    userId: 1
                    totalAccountValue: 889756.00
                    availableCash: 627500.00
                    settledCash: 753000.00
                    positions:
                      - instrumentId: 31
                        ticker: BMA
                        name: Banco Macro S.A.
                        quantity: -10
                        marketValue: -15028.00
                        totalReturnPercent: null
                      - instrumentId: 54
                        ticker: METR
                        name: MetroGAS S.A.
                        quantity: 500
                        marketValue: 114750.00
                        totalReturnPercent: -8.20
                      - instrumentId: 47
                        ticker: PAMP
                        name: Pampa Holding S.A.
                        quantity: 40
                        marketValue: 37034.00
                        totalReturnPercent: -0.45
                neverTraded:
                  summary: An existing user with no orders (FR-014, SC-005)
                  value:
                    userId: 2
                    totalAccountValue: 0.00
                    availableCash: 0.00
                    settledCash: 0.00
                    positions: []
                unpricedHolding:
                  summary: A held instrument with no market data (FR-020 to FR-022)
                  value:
                    userId: 3
                    totalAccountValue: null
                    availableCash: 477500.00
                    settledCash: 477500.00
                    positions:
                      - instrumentId: 3
                        ticker: PGR
                        name: Phoenix Global Resources
                        quantity: 25
                        marketValue: null
                        totalReturnPercent: null
        "400":
          description: The user id is not a valid identifier.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Bad Request
                status: 400
                detail: "Failed to convert 'userId' with value: 'abc'"
                instance: /api/v1/users/abc/portfolio
        "404":
          description: No user with that id (FR-024, SC-011).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Not Found
                status: 404
                detail: User 999 does not exist
                instance: /api/v1/users/999/portfolio
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/instruments/search:
    get:
      summary: Search the market's instruments by ticker or name
      description: |
        Returns one page of the instruments whose ticker **or name** contains the query (FR-001,
        FR-002, FR-003). Matching is partial and case-insensitive (FR-004) and literal: `%`, `_`,
        quotes and backslashes are ordinary characters (FR-010), and a typo matches nothing
        (FR-024). It is **not** accent-insensitive (FR-005): `río` reaches `Molinos Río de la
        Plata` and `rio` does not. Three names in the dataset carry accents; their tickers always
        match (ADR-0027).

        An instrument whose ticker and name both match appears once (FR-006).

        The order is total and stable — ticker ascending, then id — so the same query over
        unchanged data always returns the same page in the same order, and consecutive pages
        together return every match exactly once (FR-013, FR-014, FR-015b, SC-007).

        A bad paging request is **rejected, never silently adjusted** (FR-015a): a caller is never
        served a page they did not ask for.

        Read-only. It reads `instruments` and `marketdata`, never the `orders` ledger, and takes
        no user id — there is no authentication, so every caller gets the same answer (FR-021,
        ADR-0007).

        Instruments of type `MONEDA` are never returned: pesos are the currency assets are paid
        in, not a tradable asset, so `ars` and `pesos` both come back empty (FR-023, ADR-0027).
      operationId: searchInstruments
      parameters:
        - name: query
          in: query
          required: true
          description: |
            The free text to search for. Trimmed of leading and trailing whitespace before
            matching (FR-007); the trimmed form is echoed back in the response. Must not be empty
            or whitespace-only (FR-008), and must be at most `trading.search.max-query-length`
            characters after trimming (FR-009) — **64** unless the deployment configures
            otherwise. The longest instrument name in the market is 42, so a query between 43 and
            64 characters is accepted and simply matches nothing.
          schema:
            type: string
            minLength: 1
          example: pamp
        - name: page
          in: query
          required: false
          description: |
            Zero-based page number (FR-015). A page past the last one is an empty page carrying
            the real total, not an error (FR-015b). A negative page is rejected (FR-015a).
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
          example: 0
        - name: size
          in: query
          required: false
          description: |
            How many results this page holds, so a client that wants more than the default can
            ask for it in one request (FR-015a). Must be at least 1 and at most
            `trading.search.max-page-size` — **100** unless the deployment configures otherwise.
            A request above the maximum is **rejected, not clamped**.

            When absent, the deployment's `trading.search.default-page-size` applies — **20**
            unless configured otherwise (FR-015c). Both limits are settable per deployment
            through environment variables, so neither is stated here as a fixed `maximum`: the
            value in force is always the one echoed in the response or named in the rejection.
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 20
      responses:
        "200":
          description: |
            One page of matching instruments, possibly empty. A query that matches nothing is a
            success with an empty list, not a 404 (FR-011).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentSearch"
              examples:
                exactTicker:
                  summary: "`pamp` — an exact ticker match (SC-001)"
                  value:
                    query: pamp
                    page: 0
                    size: 20
                    totalElements: 1
                    totalPages: 1
                    results:
                      - instrumentId: 47
                        ticker: PAMP
                        name: Pampa Holding S.A.
                        type: ACCIONES
                        close: 925.85
                        dailyReturnPercent: 0.44
                nameFamily:
                  summary: "`banco` — one fragment returns the family (SC-002)"
                  description: |
                    All four match on their name, so the ticker orders them. This is what the
                    statement's "activos similares" means here — one shared fragment, not a
                    tolerance for typos (FR-024).
                  value:
                    query: banco
                    page: 0
                    size: 20
                    totalElements: 4
                    totalPages: 1
                    results:
                      - instrumentId: 22
                        ticker: BBAR
                        name: Banco Frances
                        type: ACCIONES
                        close: 1038.10
                        dailyReturnPercent: -0.87
                      - instrumentId: 28
                        ticker: BHIP
                        name: Banco Hipotecario S.A.
                        type: ACCIONES
                        close: 33.40
                        dailyReturnPercent: -3.47
                      - instrumentId: 31
                        ticker: BMA
                        name: Banco Macro S.A.
                        type: ACCIONES
                        close: 1502.80
                        dailyReturnPercent: -1.15
                      - instrumentId: 19
                        ticker: BPAT
                        name: Banco Patagonia
                        type: ACCIONES
                        close: 279.00
                        dailyReturnPercent: -3.46
                accentedName:
                  summary: "`compañía` — an accented name, typed with its accents (SC-003)"
                  description: Typed without them, `compania` returns nothing (FR-005, ADR-0027).
                  value:
                    query: compañía
                    page: 0
                    size: 20
                    totalElements: 1
                    totalPages: 1
                    results:
                      - instrumentId: 13
                        ticker: INTR
                        name: Compañía Introductora de Buenos Aires S.A.
                        type: ACCIONES
                        close: 77.00
                        dailyReturnPercent: 2.67
                unpricedInstrument:
                  summary: "`pgr` — an instrument with no market data (SC-009, FR-018)"
                  description: |
                    Both figures are `null`, never `0`: the price is unknown, not zero
                    (ADR-0013). The instrument is still returned, with everything that identifies
                    it: prices are looked up for the page after the match, so a missing one
                    cannot drop the instrument.
                  value:
                    query: pgr
                    page: 0
                    size: 20
                    totalElements: 1
                    totalPages: 1
                    results:
                      - instrumentId: 3
                        ticker: PGR
                        name: Phoenix Global Resources
                        type: ACCIONES
                        close: null
                        dailyReturnPercent: null
                noMatch:
                  summary: "`ZZZZ` — nothing matched (FR-011, SC-010)"
                  value:
                    query: ZZZZ
                    page: 0
                    size: 20
                    totalElements: 0
                    totalPages: 0
                    results: []
                pagedBroadQuery:
                  summary: "`a` — 59 match, the first 20 are returned (SC-005)"
                  description: |
                    `totalElements` says exactly how much the caller has not seen, which is what
                    a truncation flag could only hint at. The three results shown are the first
                    three of the twenty, in ticker order.
                  value:
                    query: a
                    page: 0
                    size: 20
                    totalElements: 59
                    totalPages: 3
                    results:
                      - instrumentId: 26
                        ticker: AGRO
                        name: Agrometal
                        type: ACCIONES
                        close: 138.00
                        dailyReturnPercent: 0.00
                      - instrumentId: 61
                        ticker: ALUA
                        name: Aluar Aluminio Argentino S.A.I.C.
                        type: ACCIONES
                        close: 410.00
                        dailyReturnPercent: -0.49
                      - instrumentId: 27
                        ticker: AUSO
                        name: Autopistas del Sol
                        type: ACCIONES
                        close: 624.00
                        dailyReturnPercent: 0.16
                pagePastTheEnd:
                  summary: "`a` page 9 — past the last page (FR-015b)"
                  description: |
                    An empty page carrying the real total, not an error and not the last page.
                    The caller can tell it overshot by comparing `page` with `totalPages`.
                  value:
                    query: a
                    page: 9
                    size: 20
                    totalElements: 59
                    totalPages: 3
                    results: []
        "400":
          description: |
            The request cannot be served: the query is missing, empty, whitespace-only (FR-008) or
            over the maximum length (FR-009); or the paging is out of bounds (FR-015a).
            Distinguishable from the empty page above: there, the search ran; here, it never ran
            (SC-010).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                blank:
                  summary: Whitespace-only query
                  value:
                    title: Bad Request
                    status: 400
                    detail: The search query must not be blank
                    instance: /api/v1/instruments/search
                missing:
                  summary: No query parameter at all
                  value:
                    title: Bad Request
                    status: 400
                    detail: "Required request parameter 'query' is not present"
                    instance: /api/v1/instruments/search
                queryTooLong:
                  summary: Query over the configured maximum
                  description: The rejection names the limit in force, which is how a configured value stays observable (FR-015c).
                  value:
                    title: Bad Request
                    status: 400
                    detail: The search query must be at most 64 characters
                    instance: /api/v1/instruments/search
                sizeTooLarge:
                  summary: A page size above the configured maximum
                  description: Rejected, never clamped — the caller is told, not quietly served something else (FR-015a).
                  value:
                    title: Bad Request
                    status: 400
                    detail: The page size must be between 1 and 100
                    instance: /api/v1/instruments/search
                negativePage:
                  summary: A negative page number
                  value:
                    title: Bad Request
                    status: 400
                    detail: The page number must not be negative
                    instance: /api/v1/instruments/search
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  responses:
    ServiceUnavailable:
      description: |
        The database did not answer in time: the request's transaction ran past its timeout, or no
        connection came free in the pool within the connection timeout. Both are configurable
        (ADR-0031). Nothing was changed; the same request can be retried.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Service Unavailable
            status: 503
            detail: The service is temporarily unavailable, try again later
            instance: /api/v1/instruments/search
  schemas:
    Portfolio:
      type: object
      required: [userId, totalAccountValue, availableCash, settledCash, positions]
      additionalProperties: false
      properties:
        userId:
          type: integer
          format: int64
          description: Echo of the requested id.
        totalAccountValue:
          type: [number, "null"]
          description: |
            `settledCash` plus the market value of every position (FR-012) — reservations
            included, because reserved pesos are still the user's money. `null` when any held
            position has no price, because a partial sum would misstate the account (FR-021,
            ADR-0013). Scale 2.
          example: 889756.00
        availableCash:
          type: number
          description: |
            Pesos available to trade: `settledCash` minus the pesos reserved by this user's
            `BUY LIMIT` orders still in `NEW` (FR-011, ADR-0004). A `SELL LIMIT` reserves shares,
            not pesos, so it does not reduce this figure. Never `null`: cash is always known.
            Scale 2.
          example: 627500.00
        settledCash:
          type: number
          description: |
            The accounting balance: the pesos effect of every `FILLED` order — `CASH_IN` and
            `SELL` proceeds add, `CASH_OUT` and `BUY` outlays subtract (FR-010) — with
            reservations **included**.

            Published so the response reconciles on its own: `totalAccountValue` equals this
            figure plus the sum of the `marketValue`s below (SC-007), which cannot be checked
            against `availableCash` whenever an order is reserving pesos. The difference
            `settledCash − availableCash` is what open `BUY LIMIT` orders commit; there is no
            separate `reservedCash` field because it is that subtraction (research R-016).
            Never `null`. Scale 2.
          example: 753000.00
        positions:
          type: array
          description: |
            One entry per instrument with a non-zero `FILLED` quantity, ordered by ticker
            ascending (research R-017). Pesos (`ARS`, type `MONEDA`) are cash, never a position
            (FR-005). A quantity of zero is not a holding and is not listed (FR-025).
          items:
            $ref: "#/components/schemas/Position"

    Position:
      type: object
      required: [instrumentId, ticker, name, quantity, marketValue, totalReturnPercent]
      additionalProperties: false
      properties:
        instrumentId:
          type: integer
          format: int64
          description: The id order submission takes; included so a client can act on a position.
          example: 47
        ticker:
          type: string
          example: PAMP
        name:
          type: string
          example: Pampa Holding S.A.
        quantity:
          type: integer
          description: |
            Signed sum of `size` over this user's `FILLED` orders for the instrument: `BUY` adds,
            `SELL` subtracts (FR-003). Orders in `NEW`, `CANCELLED` or `REJECTED` contribute
            nothing (FR-004). **May be negative**: the ledger can hold a short position the API
            forbids, and it is reported rather than hidden (ADR-0012).
          example: 40
        marketValue:
          type: [number, "null"]
          description: |
            `quantity × close`, where `close` is the latest `marketdata` row **of that instrument**
            (FR-006). `null` when the instrument has no market data, or none with a `close`
            (FR-020, research R-019) — never `0`. Negative when the quantity is. Scale 2.
          example: 37034.00
        totalReturnPercent:
          type: [number, "null"]
          description: |
            Total return on the user's own cost, in **percent units** (`-0.45` means `-0.45%`), at
            weighted average cost (FR-007, ADR-0003). Not the daily return of the instrument:
            `previousClose` is never read (FR-009). `null` when the quantity is negative — a
            negative cost basis makes the ratio meaningless (FR-018) — when the market value is
            unknown, or when the cost basis is zero. Scale 2.
          example: -0.45

    InstrumentSearch:
      type: object
      required: [query, page, size, totalElements, totalPages, results]
      additionalProperties: false
      properties:
        query:
          type: string
          description: |
            The query as it was searched: the request's parameter, trimmed (FR-007). A caller that
            sent `"  pamp  "` reads `pamp` here.
          example: pamp
        page:
          type: integer
          format: int32
          minimum: 0
          description: The zero-based page this response holds — the one that was asked for.
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          description: |
            The page size in force: what the caller asked for, or the deployment's configured
            default when they asked for nothing. Echoing it is how the configured default stays
            observable without a settings endpoint (FR-015c).
          example: 20
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many instruments matched the query in total, across every page (FR-015). This is
            what tells a caller how much they have not seen, and it is computed under the same
            snapshot as `results`, so the two never contradict each other (research R-112).
          example: 1
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: |
            How many pages of the current `size` the matches fill; `0` when nothing matched. A
            `page` at or above this value is a valid request that returns an empty list.
          example: 1
        results:
          type: array
          description: |
            This page of matches in ticker order, then id (FR-013, FR-014). Empty when nothing matched, and when
            the page is past the last one (FR-011, FR-015b). An instrument matching on both its
            ticker and its name appears once (FR-006).
          items:
            $ref: "#/components/schemas/InstrumentMatch"

    InstrumentMatch:
      type: object
      required: [instrumentId, ticker, name, type, close, dailyReturnPercent]
      additionalProperties: false
      properties:
        instrumentId:
          type: integer
          format: int64
          description: |
            The id order submission takes, so a user goes from a search to an order without a
            further lookup (FR-012, SC-008).
          example: 47
        ticker:
          type: string
          example: PAMP
        name:
          type: string
          example: Pampa Holding S.A.
        type:
          type: string
          description: |
            The instrument's type as the market records it. Never `MONEDA`: cash is excluded from
            the search (FR-023), so on the provided dataset this is `ACCIONES` on every result.
          example: ACCIONES
        close:
          type: [number, "null"]
          description: |
            The latest `close` in pesos, from the most recent `marketdata` row **of that
            instrument** — "latest" is resolved per instrument, never at one shared date (FR-016).
            `null` when the instrument has no market data, or none with a `close` (FR-018) — never
            `0` (ADR-0013). Scale 2.
          example: 925.85
        dailyReturnPercent:
          type: [number, "null"]
          description: |
            The day's move, `(close − previousClose) / previousClose`, in **percent units**
            (`0.44` means `0.44%`), from that same latest row (FR-017). Scale 2, `HALF_UP`
            (ADR-0016).

            This is the instrument's daily return, not a user's return on their own cost: the
            portfolio reports the latter and never this one, which is why the statement's
            `previousClose` rule is implemented here.

            `null` when there is no market data, when `close` is unknown, and when
            `previousClose` is unknown or zero — no division by zero occurs (FR-019). `0.00` is a
            different answer from `null`: it means the instrument closed flat, and the provided
            dataset contains one (`AGRO`).
          example: 0.44

    Problem:
      type: object
      description: |
        RFC 9457 problem detail (research R-013). `type` is **absent** on every problem this API
        currently produces, which RFC 9457 §3.1 defines as `about:blank` — the responses carry no
        problem type of their own yet. A client reads an absent `type` as `about:blank`; it is
        declared here rather than required so the document describes what ships.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
