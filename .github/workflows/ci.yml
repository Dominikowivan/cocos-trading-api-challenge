name: CI

on:
  push:
    branches: [main, develop, staging, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Scan dependencies and secrets with Trivy
        run: >
          docker run --rm
          -v "$GITHUB_WORKSPACE:/src:ro"
          -v "$HOME/.m2:/root/.m2:ro"
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          fs /src
          --skip-version-check
          --offline-scan
          --scanners vuln,secret
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --skip-dirs /src/target
          --exit-code 1

      - name: Cache SonarQube Cloud packages
        if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analyze on SonarQube Cloud
        if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B sonar:sonar -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn
