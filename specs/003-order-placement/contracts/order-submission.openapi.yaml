openapi: 3.1.0

info:
  title: Cocos Trading API — Order Placement (design-time proposal)
  version: 0.1.0
  description: |
    The design-time proposal for the order submission endpoint of feature `003-order-placement`.
    It is **not** the live contract: implementation applies this operation and its schemas to
    `docs/api/openapi.yaml`, the one file every response in the web tests validates against
    (ADR-0024), and adds the requests to `docs/api/trading-api.http`. This file is kept as it was
    proposed and is not edited afterwards (constitution, *Technology and Scope Constraints*).

    Requirement ids below (`FR-`, `SC-`, research `R-`) refer to `specs/003-order-placement/`.

    Three rules shape this operation:

    - **A rejection is a recorded outcome, not a failure.** An order the user cannot afford is
      persisted `REJECTED` and answered with `201`, carrying a machine-readable reason (FR-019,
      FR-023, R-202). A request that cannot be acted on answers `400`, `404` or `409` and writes
      nothing. The status class is how a caller tells the two apart.
    - **An instrument with no price is a refusal, not a rejection** (R-203, ADR-0034). This
      departs from the challenge statement for that one case, and the README says so.
    - **Money is exact and scaled to 2 decimals** (ADR-0016); a share count is a whole number, and
      the only rounding of one is the floor of FR-017.

servers:
  - url: http://localhost:8080
    description: Local development (docker compose database on port 5433)

paths:
  /api/v1/users/{userId}/orders:
    post:
      summary: Submit one order to the market
      description: |
        Submits exactly one order for one user and one instrument, and appends exactly one row to
        the `orders` ledger whatever the outcome (FR-021).

        A `MARKET` order executes at the instrument's latest `close` and is persisted `FILLED`; a
        `LIMIT` order is validated at the price in the request, persisted `NEW`, and reserves what
        it commits — pesos for a `BUY`, shares for a `SELL` (ADR-0004). Nothing fills a `LIMIT`
        order: there is no matching engine (ADR-0007).

        The quantity is **exactly one of** `size` (a whole number of shares) or `amount` (a total
        in pesos). From an amount the system derives `floor(amount / price)` shares — the amount is
        a ceiling, not a target, and no fraction of a share is ever traded (FR-017).

        Validation is against **available** cash and **available** holdings — the balance minus
        what `NEW` orders reserve — read from the same fold the portfolio endpoint reports
        (FR-012, FR-013, ADR-0015). Submissions for one user are serialised; submissions for
        different users never wait on each other (FR-026, ADR-0035).
      operationId: submitOrder
      parameters:
        - name: userId
          in: path
          required: true
          description: Untrusted identifier; there is no authentication (ADR-0007).
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Optional caller-supplied key (FR-028, FR-031, R-210). The first request carrying a key
            is executed and its outcome stored against it; a repeat of the **same** request with the
            **same** key returns that first outcome instead of trading again — including when the
            outcome was `REJECTED`. A repeat with a **different** body answers `409`. Keys are
            scoped per user, so the same key used by two users is two independent requests (FR-030).
            A submission without a key is processed normally.
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderSubmission"
            examples:
              marketBuyBySize:
                summary: Buy 100 PAMP at market (US1, SC-001)
                value:
                  instrumentId: 47
                  type: MARKET
                  side: BUY
                  size: 100
              marketBuyByAmount:
                summary: Spend up to 100,000.00 on PAMP at market — derives 108 shares (US2, SC-004)
                value:
                  instrumentId: 47
                  type: MARKET
                  side: BUY
                  amount: 100000.00
              limitBuyBySize:
                summary: Buy 100 PAMP at 900.00, reserving 90,000.00 (US3, SC-006)
                value:
                  instrumentId: 47
                  type: LIMIT
                  side: BUY
                  size: 100
                  price: 900.00
              limitSellByAmount:
                summary: Sell 30,000.00 of PAMP at 1,000.00 — derives 30 shares, not 32 (US4, SC-005)
                value:
                  instrumentId: 47
                  type: LIMIT
                  side: SELL
                  amount: 30000.00
                  price: 1000.00
      responses:
        "201":
          description: |
            The submission produced an order, and the order is in the body. `FILLED`, `NEW` and
            `REJECTED` all answer here, because all three appended a row to the ledger (FR-023,
            R-202). A replayed idempotent request answers here too, with the order the first one
            produced (FR-028).

            There is no `Location` header: no endpoint reads a single order back, and the order's
            effect is visible in the user's next portfolio read (FR-025, R-216).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              examples:
                filled:
                  summary: 100 PAMP bought at the last close (SC-001)
                  value:
                    orderId: 12
                    userId: 1
                    instrumentId: 47
                    ticker: PAMP
                    type: MARKET
                    side: BUY
                    status: FILLED
                    size: 100
                    price: 925.85
                    rejectionReason: null
                    submittedAt: "2026-11-17T14:32:05"
                derivedFromAmount:
                  summary: 100,000.00 of PAMP buys 108 shares for 99,991.80 (SC-004)
                  value:
                    orderId: 13
                    userId: 1
                    instrumentId: 47
                    ticker: PAMP
                    type: MARKET
                    side: BUY
                    status: FILLED
                    size: 108
                    price: 925.85
                    rejectionReason: null
                    submittedAt: "2026-11-17T14:33:11"
                newLimit:
                  summary: A limit buy, reserving 90,000.00 of available cash (SC-006)
                  value:
                    orderId: 14
                    userId: 1
                    instrumentId: 47
                    ticker: PAMP
                    type: LIMIT
                    side: BUY
                    status: NEW
                    size: 100
                    price: 900.00
                    rejectionReason: null
                    submittedAt: "2026-11-17T14:34:02"
                rejectedForFunds:
                  summary: 1,000 PAMP against 627,500.00 available (US1 scenario 2)
                  value:
                    orderId: 15
                    userId: 1
                    instrumentId: 47
                    ticker: PAMP
                    type: MARKET
                    side: BUY
                    status: REJECTED
                    size: 1000
                    price: 925.85
                    rejectionReason: INSUFFICIENT_FUNDS
                    submittedAt: "2026-11-17T14:35:40"
                rejectedForHoldings:
                  summary: Selling 41 PAMP while holding 40 (SC-003)
                  value:
                    orderId: 16
                    userId: 1
                    instrumentId: 47
                    ticker: PAMP
                    type: MARKET
                    side: SELL
                    status: REJECTED
                    size: 41
                    price: 925.85
                    rejectionReason: INSUFFICIENT_HOLDINGS
                    submittedAt: "2026-11-17T14:36:18"
                rejectedBelowOneShare:
                  summary: 500.00 does not reach one share at 925.85 (US2 scenario 3)
                  value:
                    orderId: 17
                    userId: 1
                    instrumentId: 47
                    ticker: PAMP
                    type: MARKET
                    side: BUY
                    status: REJECTED
                    size: 0
                    price: 925.85
                    rejectionReason: SIZE_BELOW_ONE_SHARE
                    submittedAt: "2026-11-17T14:37:00"
        "400":
          description: |
            The request could not be acted on and **nothing was written** (FR-003 to FR-008,
            R-212). The detail names the rule that refused it. This covers: both `size` and
            `amount`, or neither; a `LIMIT` without a `price`; a `MARKET` carrying a `price`; a
            `side` that is not `BUY` or `SELL`; a `size` or `amount` outside the bounds the ledger
            can represent; an unknown `instrumentId`; a `MONEDA` instrument; a `MARKET` order for an
            instrument with no market price (R-203); and a malformed body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                bothQuantities:
                  summary: Both a size and an amount (FR-003)
                  value:
                    title: Bad Request
                    status: 400
                    detail: An order states either a size or an amount, never both
                    instance: /api/v1/users/1/orders
                limitWithoutPrice:
                  summary: A LIMIT order with no price (FR-005)
                  value:
                    title: Bad Request
                    status: 400
                    detail: A LIMIT order requires a price greater than zero
                    instance: /api/v1/users/1/orders
                marketWithPrice:
                  summary: A MARKET order carrying a price — refused, never ignored (FR-005)
                  value:
                    title: Bad Request
                    status: 400
                    detail: A MARKET order executes at the latest close and takes no price
                    instance: /api/v1/users/1/orders
                cashInstrument:
                  summary: A MONEDA instrument (FR-008)
                  value:
                    title: Bad Request
                    status: 400
                    detail: "Instrument 66 (ARS) is cash, not a tradable instrument"
                    instance: /api/v1/users/1/orders
                noPrice:
                  summary: A MARKET order for an instrument that does not quote (R-203, SC-009)
                  value:
                    title: Bad Request
                    status: 400
                    detail: "Instrument 3 (PGR) has no market price, so a MARKET order has no execution price"
                    instance: /api/v1/users/1/orders
                cashSide:
                  summary: CASH_IN is not an order against the market (FR-002)
                  value:
                    title: Bad Request
                    status: 400
                    detail: "Unknown side 'CASH_IN': an order is BUY or SELL"
                    instance: /api/v1/users/1/orders
        "404":
          description: No user with that id — the request's target does not exist (FR-007, R-212).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Not Found
                status: 404
                detail: No user with id 99999
                instance: /api/v1/users/99999/orders
        "409":
          description: |
            The `Idempotency-Key` was already used by this user for a **different** request
            (FR-029). Nothing was written, and the earlier order is not disclosed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Conflict
                status: 409
                detail: Idempotency key 7c9e6679-7425-40de-944b-e07fc1f90ae7 was used for a different request
                instance: /api/v1/users/1/orders
        "503":
          description: |
            The database did not answer in time, or no connection came free in the pool (ADR-0031).
            A submission that waited on another submission of the same user past the transaction
            deadline lands here (R-209). **Nothing was written** and the same request can be
            retried — safely, if it carried an idempotency key.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Service Unavailable
                status: 503
                detail: The service is temporarily unavailable, try again later
                instance: /api/v1/users/1/orders

components:
  schemas:
    OrderSubmission:
      type: object
      required: [instrumentId, type, side]
      additionalProperties: false
      description: |
        One submission. It carries no status and no cancellation flag: the status is derived from
        the order type and the validation, and cancelling is a separate endpoint (FR-006,
        ADR-0006).
      properties:
        instrumentId:
          type: integer
          format: int64
          minimum: 1
          description: |
            The instrument to trade — the same id the search returns, so a client goes from a
            result to an order with no further lookup (SC-013). Must exist and must not be of type
            `MONEDA` (FR-007, FR-008).
          example: 47
        type:
          type: string
          enum: [MARKET, LIMIT]
          description: |
            `MARKET` executes at the instrument's latest `close` and takes no `price`; `LIMIT` is
            validated at the `price` in this request and is born `NEW` (FR-009, FR-011, FR-020).
          example: MARKET
        side:
          type: string
          enum: [BUY, SELL]
          description: |
            `BUY` or `SELL` only. `CASH_IN` and `CASH_OUT` exist in the ledger and count towards
            cash, but they are not orders against the market and are refused here (FR-002).
          example: BUY
        size:
          type: [integer, "null"]
          format: int32
          minimum: 1
          description: |
            An exact number of whole shares. **Mutually exclusive with `amount`**: a request
            carries exactly one of the two (FR-003). At least `1`, at most what the ledger's `size`
            column can hold (R-207).
          example: 100
        amount:
          type: [number, "null"]
          minimum: 0
          exclusiveMinimum: true
          description: |
            A total to trade in pesos, instead of a share count. The system derives
            `floor(amount / price)` shares, so the amount is a **ceiling**: `100,000.00` of `PAMP`
            at `925.85` spends `99,991.80` and leaves `8.20` unspent (FR-017). An amount that does
            not reach one share is `REJECTED` with a derived size of `0`. Greater than zero, scale
            2 (ADR-0016).
          example: 100000.00
        price:
          type: [number, "null"]
          minimum: 0
          exclusiveMinimum: true
          description: |
            The price for a `LIMIT` order — **required** for one, and **refused** on a `MARKET`
            order rather than silently ignored (FR-005). It governs both sides of the amount
            comparison, so a limit order is bounded by the user's own price and not by the
            market's (FR-018). Greater than zero, scale 2.
          example: 900.00

    Order:
      type: object
      required:
        [orderId, userId, instrumentId, ticker, type, side, status, size, price, rejectionReason, submittedAt]
      additionalProperties: false
      description: |
        The order this submission appended to the ledger (FR-023). Exactly one row exists per
        processed submission, whatever its status.
      properties:
        orderId:
          type: integer
          format: int64
          description: The ledger row's id, assigned by the database.
          example: 12
        userId:
          type: integer
          format: int64
          description: Echo of the path's id.
          example: 1
        instrumentId:
          type: integer
          format: int64
          example: 47
        ticker:
          type: string
          example: PAMP
        type:
          type: string
          enum: [MARKET, LIMIT]
          example: MARKET
        side:
          type: string
          enum: [BUY, SELL]
          example: BUY
        status:
          type: string
          enum: [FILLED, NEW, REJECTED]
          description: |
            `FILLED` — an accepted `MARKET` order, executed at the latest `close`. `NEW` — an
            accepted `LIMIT` order, reserving what it commits; nothing fills it (ADR-0007).
            `REJECTED` — the user could not pay, did not hold the shares, or the amount did not
            reach one share; the order is **stored** as the statement requires (FR-019, FR-020).
            `CANCELLED` never originates here (ADR-0006).
          example: FILLED
        size:
          type: integer
          format: int32
          description: |
            The size the order actually carries: the requested one, or the one derived from the
            amount (FR-023). **`0` on a rejection that never got as far as a size** — an amount
            below one share's price, or an amount that already exceeded what was available.
          example: 100
        price:
          type: number
          description: |
            The price the order was recorded at, which is the price it was validated against: the
            instrument's latest `close` for a `MARKET` order, the requested price for a `LIMIT`
            one (FR-009, FR-011). Never `null` and never `0`: a `MARKET` order for an instrument
            with no price is refused with `400` before anything is written (R-203). Scale 2.
          example: 925.85
        rejectionReason:
          type: [string, "null"]
          enum: [INSUFFICIENT_FUNDS, INSUFFICIENT_HOLDINGS, SIZE_BELOW_ONE_SHARE, null]
          description: |
            Machine-readable cause, present exactly when `status` is `REJECTED` (FR-019).

            `INSUFFICIENT_FUNDS` — available cash was below what the order needed, validated
            against the figure the portfolio reports, reservations included (ADR-0004, ADR-0015).
            `INSUFFICIENT_HOLDINGS` — the available holding was below the shares to sell; a
            position at or below zero rejects every sale, and the dataset's `BMA` at `−10` is such
            a position (ADR-0012). `SIZE_BELOW_ONE_SHARE` — the amount derived `floor(...) == 0`.

            There is no `NO_PRICE_AVAILABLE`: that case is a `400` and is never recorded (R-203,
            ADR-0034).
          example: null
        submittedAt:
          type: string
          format: date-time
          description: |
            When the server processed the submission; the caller sends no timestamp (R-213). Local
            date-time, as the ledger's `datetime` column stores it.
          example: "2026-11-17T14:32:05"

    Problem:
      type: object
      description: |
        RFC 9457 problem detail, as the rest of the API already produces it. `type` is absent,
        which RFC 9457 §3.1 defines as `about:blank`.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
